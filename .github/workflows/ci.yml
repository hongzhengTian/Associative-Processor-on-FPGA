name: ci

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf
      - name: Lint
        run: make lint
      - name: Simulate
        run: make -j4 test

  synthesize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
      - name: Synthesize
        run: make -j3 synth
      - name: Resource summary
        run: cat syn/build/summary.md >> "$GITHUB_STEP_SUMMARY"
