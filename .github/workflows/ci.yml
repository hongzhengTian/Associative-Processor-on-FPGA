name: ci

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf gcc-arm-none-eabi
      - name: Lint
        run: make lint
      - name: Simulate
        run: make -j4 test
      - name: Program images of the Zynq host are up to date
        run: |
          make -C sw zynq
          git diff --exit-code fpga/zynq/host/ap_programs.h

  synthesize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
      - name: Synthesize
        run: make -j3 synth
      - name: Resource summary
        run: cat syn/build/summary.md >> "$GITHUB_STEP_SUMMARY"
