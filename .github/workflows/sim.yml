name: simulation

on:
  push:
  pull_request:

jobs:
  icarus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Simulate and check results
        run: make -C sim
