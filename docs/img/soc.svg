<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="470" fill="#ffffff"/>

  <!-- SoC boundary -->
  <rect x="20" y="20" width="840" height="430" rx="8" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="34" y="42" fill="#666" font-size="12">ap_soc</text>

  <!-- CPU -->
  <rect x="40" y="60" width="190" height="80" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="135" y="92" text-anchor="middle" font-weight="bold">PicoRV32</text>
  <text x="135" y="112" text-anchor="middle">RV32IM, rdcycle</text>

  <!-- RAM, IO -->
  <rect x="40" y="200" width="190" height="56" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="135" y="223" text-anchor="middle" font-weight="bold">On-chip RAM</text>
  <text x="135" y="242" text-anchor="middle">64 KiB, 0x0000_0000</text>
  <rect x="40" y="290" width="190" height="56" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="135" y="313" text-anchor="middle" font-weight="bold">I/O port</text>
  <text x="135" y="332" text-anchor="middle">0x1000_0000</text>
  <rect x="40" y="374" width="190" height="50" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="135" y="395" text-anchor="middle" font-weight="bold">AXI adapter</text>
  <text x="135" y="413" text-anchor="middle">0x8000_0000 window</text>

  <!-- CPU bus -->
  <line x1="135" y1="140" x2="135" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M60,140 V180 H30 V318 H40" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M60,180 H30 V399 H40" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="140" y="178" font-size="11" fill="#555">memory bus</text>

  <!-- AP unit -->
  <rect x="300" y="50" width="360" height="380" rx="8" fill="#eaf2fb" stroke="#2a5d9f" stroke-width="1.5"/>
  <text x="316" y="72" font-weight="bold" fill="#2a5d9f">AP unit</text>

  <rect x="316" y="84" width="140" height="40" rx="5" fill="#ffffff" stroke="#2a5d9f"/>
  <text x="386" y="109" text-anchor="middle">PCPI adapter</text>

  <rect x="316" y="140" width="328" height="40" rx="5" fill="#ffffff" stroke="#2a5d9f"/>
  <text x="480" y="165" text-anchor="middle">Decoder and bit-serial sequencer</text>

  <rect x="316" y="196" width="200" height="84" rx="5" fill="#d4e5f7" stroke="#2a5d9f"/>
  <text x="416" y="225" text-anchor="middle" font-weight="bold">Bit-plane array</text>
  <text x="416" y="245" text-anchor="middle">ROWS x COLS bits</text>
  <text x="416" y="264" text-anchor="middle" font-size="11">plane c = bit c of all rows</text>

  <rect x="526" y="196" width="118" height="84" rx="5" fill="#d4e5f7" stroke="#2a5d9f"/>
  <text x="585" y="222" text-anchor="middle" font-weight="bold">Row ALUs</text>
  <text x="585" y="242" text-anchor="middle" font-size="11">1 per row:</text>
  <text x="585" y="258" text-anchor="middle" font-size="11">adder, carry,</text>
  <text x="585" y="273" text-anchor="middle" font-size="11">flag, tag</text>
  <line x1="516" y1="226" x2="526" y2="226" stroke="#2a5d9f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="526" y1="252" x2="516" y2="252" stroke="#2a5d9f" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="316" y="296" width="150" height="50" rx="5" fill="#ffffff" stroke="#2a5d9f"/>
  <text x="391" y="317" text-anchor="middle">Transpose buffer</text>
  <text x="391" y="335" text-anchor="middle" font-size="11">32 x 32 bits</text>

  <rect x="476" y="296" width="168" height="50" rx="5" fill="#ffffff" stroke="#2a5d9f"/>
  <text x="560" y="317" text-anchor="middle">Reductions</text>
  <text x="560" y="335" text-anchor="middle" font-size="11">COUNT, FIRST, MAX/MIN</text>

  <rect x="316" y="362" width="328" height="50" rx="5" fill="#ffffff" stroke="#2a5d9f"/>
  <text x="480" y="384" text-anchor="middle">DMA engine</text>
  <text x="480" y="401" text-anchor="middle" font-size="11">AXI4 bursts, 32 rows per segment</text>

  <line x1="386" y1="124" x2="386" y2="140" stroke="#2a5d9f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="180" x2="480" y2="196" stroke="#2a5d9f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="391" y1="280" x2="391" y2="296" stroke="#2a5d9f" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="391" y1="346" x2="391" y2="362" stroke="#2a5d9f" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- CPU to AP -->
  <line x1="230" y1="100" x2="316" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="240" y="92" font-size="11" fill="#555">custom-1</text>
  <text x="240" y="118" font-size="11" fill="#555">rs1, rs2 / rd</text>

  <!-- external memory -->
  <rect x="880" y="200" width="145" height="90" rx="6" fill="#fff3e0" stroke="#b36b00"/>
  <text x="952" y="230" text-anchor="middle" font-weight="bold">External memory</text>
  <text x="952" y="250" text-anchor="middle">AXI4, 32-bit</text>
  <text x="952" y="270" text-anchor="middle" font-size="11">HBM / DDR on U280</text>

  <rect x="690" y="362" width="150" height="50" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="765" y="384" text-anchor="middle">CPU / DMA select</text>
  <text x="765" y="401" text-anchor="middle" font-size="11">one AXI4 master</text>

  <line x1="644" y1="387" x2="690" y2="387" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M230,415 V440 H675 V402 H690" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M840,387 H952 V290" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="868" y="380" font-size="11" fill="#555">m_axi</text>
</svg>
