<text x="560" y="54" font-weight="bold">Timeline</text>
<text x="560" y="92" font-size="12" font-weight="bold">cycle 0</text>
<text x="630" y="92" font-size="12">decode, latch fields</text>
<text x="560" y="118" font-size="12" font-weight="bold">cycle 1</text>
<text x="630" y="118" font-size="12">bit 0: d0 = a0 ^ b0, c = a0 &amp; b0</text>
<text x="560" y="144" font-size="12" font-weight="bold">cycle 2</text>
<text x="630" y="144" font-size="12">bit 1, using the carry of bit 0</text>
<text x="560" y="170" font-size="12" font-weight="bold">...</text>
<text x="630" y="170" font-size="12"></text>
<text x="560" y="196" font-size="12" font-weight="bold">cycle 8</text>
<text x="630" y="196" font-size="12">bit 7, last write</text>
<text x="560" y="222" font-size="12" font-weight="bold">cycle 9</text>
<text x="630" y="222" font-size="12">result to the CPU</text>
<text x="560" y="270" font-size="12" fill="#333">An L-bit operation takes about L cycles for any</text>
<text x="560" y="288" font-size="12" fill="#333">number of rows: the rows work in parallel and</text>
<text x="560" y="306" font-size="12" fill="#333">the bits in sequence (bit-serial, word-parallel).</text>
<text x="560" y="324" font-size="12" fill="#333"></text>
<text x="560" y="342" font-size="12" fill="#333">Rows with tag = 0 are not written, so the tag</text>
<text x="560" y="360" font-size="12" fill="#333">works as a per-row predicate. Compares compute</text>
<text x="560" y="378" font-size="12" fill="#333">a new tag the same way, one bit per cycle.</text>
</g>
</svg>
